<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Glowing border -->
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Central Emblem -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="url(#accentGrad)" opacity="0.2"/>
    <circle cx="150" cy="150" r="110" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8"/>
    <!-- Task and Esports Arena Monogram (TEA) -->
    <text x="150" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="2">TEA</text>
  </g>
</svg>
